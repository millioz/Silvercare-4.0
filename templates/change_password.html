{% extends 'base.html' %}{% block title %}SILVERCARE — Change Password{% endblock %}
{% block content %}<section class="password-wrap"><div class="panel login-panel"><div class="panel-kicker">ACCOUNT SECURITY</div><h2>Change password</h2><p class="muted">Choose a unique password with at least 8 characters.</p><form method="post" class="form-stack"><label>Current password<input type="password" name="current_password" required autocomplete="current-password"></label><label>New password<input type="password" name="new_password" minlength="8" required autocomplete="new-password"></label><button class="primary-btn" type="submit">Update password <span>→</span></button></form></div></section>{% endblock %}
